# OTO 家政服务平台 —— 本地开发用容器编排
# 基础设施（PostgreSQL / Redis）+ 测试容器（api-test，profile=test）。
# 不含 api / 前端 / nginx 运行时。
#
# 使用前：把根目录 .env.example 复制为 .env 并填写（POSTGRES_PASSWORD、REDIS_PASSWORD 必填）。
# 启动：make up          —— 只起基础设施，不会拉起 api-test
# 测试：make test         —— 在 api-test 容器里跑全部测试（单元 + 集成）

name: oto-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: oto-postgres
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB 由根目录 .env 提供
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oto}
      POSTGRES_DB: ${POSTGRES_DB:-oto}
    # 宿主机端口映射不在这里，见 docker-compose.dev.ports.yml（覆盖层）。
    # 基础层不发布端口，测试场景（api-test 走 compose 内部网络）就不需要宿主机端口，
    # 宿主机 5432 被别的 postgres 占着时也能直接跑测试。
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oto} -d ${POSTGRES_DB:-oto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oto-dev

  redis:
    image: redis:7-alpine
    container_name: oto-redis
    restart: unless-stopped
    # REDIS_PASSWORD 由根目录 .env 提供；为空时不启用 requirepass
    env_file:
      - ../../.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    # 宿主机端口映射不在这里，见 docker-compose.dev.ports.yml（覆盖层）。
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - oto-dev

# 测试容器：只跑 pytest，不对外暴露端口。
  # profile=test —— `make up` 不拉起它，只有 `make test` / `make test-unit` 会用。
  api-test:
    build:
      # 上下文是仓库根：Dockerfile 里要 COPY apps/api/...
      context: ../..
      dockerfile: apps/api/Dockerfile.test
    image: oto-api-test:latest
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内走 compose 网络，主机名是服务名，不是 localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oto}:${POSTGRES_PASSWORD:-oto}@postgres:5432/${POSTGRES_DB:-oto}
      # 集成测试必须用独立库：集成 fixture 每次会 drop_all + create_all，
      # 指到开发库上会把开发数据清空
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oto}:${POSTGRES_PASSWORD:-oto}@postgres:5432/${POSTGRES_DB:-oto}_test
      # 守卫开关：集成测试不许静默 skip（见 apps/api/tests/conftest.py）
      REQUIRE_INTEGRATION: "1"
      # 集成测试数量下限，少于这个数说明测试没被收集到，直接判失败
      # 新增集成测试后同步更新这个值（跑全量时会提示当前实际数量）
      EXPECTED_INTEGRATION_TESTS: "224"
      # JWT 验签配置：鉴权依赖（app/core/auth.py）读这三个。
      # 容器里读不到仓库根的 .env（app/core/config.py 的 env_file 在容器内指向
      # 不存在的路径），所以必须显式传进来。JWT_SECRET 缺失直接报错，
      # 免得用空密钥把服务起起来。
      # 长度要求：至少 32 字节（RFC 7518 HS256）。compose 插值只能判断"有没有"，
      # 判不了"够不够长"——长度由 app/core/config.py 的 field_validator 在启动时
      # 强制，短密钥会直接抛 ValueError 拒绝启动。
      JWT_SECRET: ${JWT_SECRET:?缺少 JWT_SECRET，请在根目录 .env 里填写（至少 32 字节）}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-120}
      # 应用环境：决定 mock 支付回调接口（/api/v1/pay/mock-notify）开不开放。
      # 测试要跑这个接口，所以显式传 dev；不给的话 app/core/config.py 的默认值
      # 是 prod（fail-closed），mock 接口会被 403 掉。
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      # 挂载源码：改代码后重跑不必重建镜像
      - ../../apps/api:/app/apps/api
    networks:
      - oto-dev

networks:
  oto-dev:
    name: oto-dev
    driver: bridge

volumes:
  pgdata:
    name: oto-pgdata
  redisdata:
    name: oto-redisdata
