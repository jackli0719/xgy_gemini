name: CI

# 触发时机：
# - pull_request 到 main：每次提 PR 都跑一遍（三个 job 并行）
# - push 到 main：合并之后在 main 上再跑一遍（防止本地能过、CI 不能过）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一个 ref 的新提交把旧的跑批取消掉，省 CI 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只有读权限；review-gate 自己申请 pull-requests: write。
permissions:
  contents: read

jobs:
  # ==============================================================
  # 1. 后端测试：单元 + 集成，全量跑，集成测试不许静默 skip
  # ==============================================================
  backend-test:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # 用户名 / 库名不是机密，直接写死（healthcheck 里也要用同样的值）。
          # 密码是机密，走 Secret——它必须与 DATABASE_URL / TEST_DATABASE_URL
          # 里嵌的密码一致。
          POSTGRES_USER: oto
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: oto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oto -d oto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    env:
      # 应用库（后端代码读它）
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 集成测试库（必须与 DATABASE_URL 不是同一个库：
      # 集成 fixture 每次会 drop_all + create_all）
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # JWT 验签密钥，至少 32 字节（RFC 7518 HS256）；
      # 短密钥会被 app/core/config.py 在启动时拒绝
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # 短信验证码（dev 下留空等于 123456）
      LOGIN_SMS_CODE: ${{ secrets.LOGIN_SMS_CODE }}
      # dev：mock 支付回调接口（/api/v1/pay/mock-notify）才开着，
      # 不然默认 prod 会把 mock 接口 403 掉
      APP_ENV: dev
      # 守卫开关：集成测试必须真的跑，一个都不许 skip
      # （见 apps/api/tests/conftest.py）
      REQUIRE_INTEGRATION: "1"
      # 集成测试数量下限。与 infra/compose/docker-compose.dev.yml 里的
      # 同名值保持一致；新增集成测试时两边一起改。
      EXPECTED_INTEGRATION_TESTS: "276"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 单元测试（不含集成）
        run: pytest -m "not integration"

      - name: 集成测试（必须真跑，不许 skip）
        run: pytest -m integration

      - name: 守卫：集成测试不许整体消失
        # conftest 的「数量下限」守卫只在全量运行时生效，
        # 而上面两轮都带了 -m 过滤（全量运行的判定见 conftest 的
        # _detect_full_run），所以这里单独数一遍收集到的集成用例数：
        # 少了就是「集成测试整体不见了」，必须红。
        run: |
          set -euo pipefail
          count=$(pytest --collect-only -q -m integration 2>/dev/null | grep -c '::' || true)
          echo "集成测试收集到 $count 个，下限 $EXPECTED_INTEGRATION_TESTS"
          if [ "$count" -lt "$EXPECTED_INTEGRATION_TESTS" ]; then
            echo "::error::集成测试数 $count 少于下限 $EXPECTED_INTEGRATION_TESTS"
            exit 1
          fi

  # ==============================================================
  # 2. 前端测试：三个 workspace 各跑各的（typecheck / test / build）
  # ==============================================================
  frontend-test:
    name: 前端测试（${{ matrix.pkg }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 一个 workspace 红了不影响另外两个——三个都要看到结果
      fail-fast: false
      matrix:
        pkg:
          - h5-user
          - web-admin
          - h5-master
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # 装依赖与跑 workspace 的脚本都在仓库根做（npm workspaces 的根），
      # --workspace 指定具体包，和 Makefile 里的写法一致。
      - name: 装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck --workspace @oto/${{ matrix.pkg }}

      - name: 单元测试
        run: npm run test --workspace @oto/${{ matrix.pkg }}

      - name: 构建
        run: npm run build --workspace @oto/${{ matrix.pkg }}

  # ==============================================================
  # 3. 审查门禁：只审 diff，出现 critical / high 就阻断
  # ==============================================================
  review-gate:
    name: 审查门禁（critical / high 阻断）
    # 只在 PR 上跑：push 到 main 的代码已经过 PR 门禁了
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 检出 PR 代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 准备审查输入（规则 + diff）
        id: prep
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # base 分支的完整历史：合并基点（merge base）常常在 base 的历史里
          # 而不是 head 的历史里——PR 分支从旧 main 拉出来、期间 main 又被
          # 合了新东西时，base 的 tip 并不是 head 的祖先，三点 diff 会直接
          # 报 "no merge base"。
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          # 合并基点 = base 与 head 的最近公共祖先，也就是 GitHub 上这个 PR
          # 展示的那份 diff 的起点
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "合并基点：$base"
          git diff --unified=3 "$base" "$HEAD_SHA" > /tmp/pr.diff
          {
            echo "下面是一次 pull request 的改动。请按「审查规则」一节审查。"
            echo "只输出规则里约定格式的 JSON 数组，不要输出别的文字。"
            echo "不要修改文件，不要执行命令。"
            echo
            echo "## 审查规则"
            cat code_review_agent/skills/code-review-and-quality/SKILL.md
            echo
            echo "## 本次改动的 diff"
            echo '```diff'
            cat /tmp/pr.diff
            echo '```'
          } > /tmp/review_prompt.md
          {
            echo "prompt<<OTO_REVIEW_PROMPT_EOF"
            cat /tmp/review_prompt.md
            echo "OTO_REVIEW_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 跑审查代理
        id: agy
        # 第三方 action 锁 commit SHA（不用 @main：@main 随时会被改）
        uses: rsamborski/run-agy-sdk@a016fe89e8c0ce9d7d2c2d4e79f94bff6da0b240
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: one-shot
          prompt: ${{ steps.prep.outputs.prompt }}
          trust-workspace: "false"
          upload_artifacts: "false"

      - name: 判定（critical / high 就阻断）
        env:
          REVIEW_RESPONSE: ${{ steps.agy.outputs.response }}
        run: |
          set -euo pipefail
          printf '%s' "${REVIEW_RESPONSE}" > /tmp/review_raw.txt
          python3 - <<'PY'
          import json
          import re
          import sys

          raw = open("/tmp/review_raw.txt", encoding="utf-8").read()
          # 代理可能把 JSON 包在 ``` 围栏里，也可能前后带解说，先剥围栏
          cleaned = re.sub(r"```(?:json)?", "", raw)
          start, end = cleaned.find("["), cleaned.rfind("]")
          if start == -1 or end <= start:
              print("::error::审查输出里找不到 JSON 数组，无法判定（按 fail-closed 阻断）")
              sys.exit(1)
          try:
              data = json.loads(cleaned[start:end + 1])
          except Exception as exc:
              print("::error::审查输出不是合法 JSON：{}（按 fail-closed 阻断）".format(exc))
              sys.exit(1)
          if not isinstance(data, list):
              print("::error::审查输出不是 JSON 数组（按 fail-closed 阻断）")
              sys.exit(1)
          with open("/tmp/review.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False)
          print("审查结果共 {} 条".format(len(data)))
          PY
          blocking=$(jq '[.[] | select(((.severity // "") | ascii_downcase) == "critical" or ((.severity // "") | ascii_downcase) == "high")] | length' /tmp/review.json)
          echo "blocking=$blocking"
          jq -r '.[] | "- \(.severity // "?") \(.file // "?"):\(.line // 0) \(.description // "")"' /tmp/review.json || true
          if [ "$blocking" -gt 0 ]; then
            echo "::error::审查发现 $blocking 个 critical/high 问题，阻断合并"
            exit 1
          fi
          echo "审查通过：没有 critical/high 问题"
