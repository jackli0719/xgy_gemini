name: CI

# 触发时机：
# - pull_request 到 main：每次提 PR 都跑一遍（两个 job 并行）
# - push 到 main：合并之后在 main 上再跑一遍（防止本地能过、CI 不能过）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一个 ref 的新提交把旧的跑批取消掉，省 CI 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只有读权限：这个 workflow 只跑测试，不需要写任何东西。
permissions:
  contents: read

jobs:
  # ==============================================================
  # 1. 后端测试：单元 + 集成，全量跑，集成测试不许静默 skip
  # ==============================================================
  backend-test:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # 用户名 / 库名不是机密，直接写死（healthcheck 里也要用同样的值）。
          # 密码是机密，走 Secret——它必须与 DATABASE_URL / TEST_DATABASE_URL
          # 里嵌的密码一致。
          POSTGRES_USER: oto
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: oto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oto -d oto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    env:
      # 应用库（后端代码读它）
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 集成测试库（必须与 DATABASE_URL 不是同一个库：
      # 集成 fixture 每次会 drop_all + create_all）
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # JWT 验签密钥，至少 32 字节（RFC 7518 HS256）；
      # 短密钥会被 app/core/config.py 在启动时拒绝
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # 短信验证码（dev 下留空等于 123456）
      LOGIN_SMS_CODE: ${{ secrets.LOGIN_SMS_CODE }}
      # dev：mock 支付回调接口（/api/v1/pay/mock-notify）才开着，
      # 不然默认 prod 会把 mock 接口 403 掉
      APP_ENV: dev
      # 守卫开关：集成测试必须真的跑，一个都不许 skip
      # （见 apps/api/tests/conftest.py）
      REQUIRE_INTEGRATION: "1"
      # 集成测试数量下限。与 infra/compose/docker-compose.dev.yml 里的
      # 同名值保持一致；新增集成测试时两边一起改。
      EXPECTED_INTEGRATION_TESTS: "303"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 单元测试（不含集成）
        run: pytest -m "not integration"

      - name: 集成测试（必须真跑，不许 skip）
        run: pytest -m integration

      - name: 守卫：集成测试不许整体消失
        # conftest 的「数量下限」守卫只在全量运行时生效，
        # 而上面两轮都带了 -m 过滤（全量运行的判定见 conftest 的
        # _detect_full_run），所以这里单独数一遍收集到的集成用例数：
        # 少了就是「集成测试整体不见了」，必须红。
        run: |
          set -euo pipefail
          # 注意：不要再加 -q。pytest.ini 的 addopts 里已经有 -q，
          # 再加一个就成了 -qq，收集结果会变成「每个文件一行计数」，
          # 里面没有 "::"，下面的计数会数成 0（第一次 CI 就栽在这）。
          count=$(pytest --collect-only -m integration 2>/dev/null | grep -c '::' || true)
          echo "集成测试收集到 $count 个，下限 $EXPECTED_INTEGRATION_TESTS"
          if [ "$count" -lt "$EXPECTED_INTEGRATION_TESTS" ]; then
            echo "::error::集成测试数 $count 少于下限 $EXPECTED_INTEGRATION_TESTS"
            exit 1
          fi

  # ==============================================================
  # 2. 前端测试：三个 workspace 各跑各的（typecheck / test / build）
  # ==============================================================
  frontend-test:
    name: 前端测试（${{ matrix.pkg }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 一个 workspace 红了不影响另外两个——三个都要看到结果
      fail-fast: false
      matrix:
        pkg:
          - h5-user
          - web-admin
          - h5-master
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # 装依赖与跑 workspace 的脚本都在仓库根做（npm workspaces 的根），
      # --workspace 指定具体包，和 Makefile 里的写法一致。
      - name: 装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck --workspace @oto/${{ matrix.pkg }}

      - name: 单元测试
        run: npm run test --workspace @oto/${{ matrix.pkg }}

      - name: 构建
        run: npm run build --workspace @oto/${{ matrix.pkg }}
