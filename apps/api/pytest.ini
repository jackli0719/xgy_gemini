[pytest]
# 把 apps/api 放进 sys.path，使测试可以 import app.*
pythonpath = .
testpaths = tests
# --strict-markers：未注册的 marker 直接报错，避免拼错的 marker 静默失效
addopts = -q --strict-markers
# 异步测试：async def 的测试与 fixture 自动交给 pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: 需要真实 PostgreSQL 的集成测试（TEST_DATABASE_URL 指向独立测试库）
